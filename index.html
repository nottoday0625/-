<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游紫来</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">

</head>
<body>
<style>
  :root {
    --bg: #F3F7F0;
    --surface: #FFFFFF;
    --surface-soft: #EAF1E6;
    --ink: #26301E;
    --muted: #75816A;
    --accent: #4A8C5E;
    --accent-deep: #356B49;
    --line: #DEE7D7;
    --font-display: "ZCOOL XiaoWei", "STKaiti", "KaiTi", serif;
    --font-body: "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161D14;
      --surface: #1F2820;
      --surface-soft: #28332A;
      --ink: #E3EBDE;
      --muted: #9AA68F;
      --accent: #6FAC82;
      --accent-deep: #8FC49F;
      --line: #2C382B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161D14;
    --surface: #1F2820;
    --surface-soft: #28332A;
    --ink: #E3EBDE;
    --muted: #9AA68F;
    --accent: #6FAC82;
    --accent-deep: #8FC49F;
    --line: #2C382B;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    overflow-x: hidden;
  }

  .deco {
    position: fixed;
    top: -30px;
    right: -30px;
    width: 220px;
    height: 220px;
    color: var(--accent);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 72px 28px 56px;
    display: flex;
    flex-direction: column;
    gap: 52px;
  }

  /* ---- hero ---- */
  .hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 44px;
  }
  .name {
    font-family: var(--font-display);
    font-size: clamp(2.6rem, 7vw, 3.4rem);
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: 0.02em;
    margin: 0 0 14px;
    color: var(--ink);
    text-wrap: balance;
  }
  .role {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--accent-deep);
  }
  .portrait {
    flex: none;
    width: 160px;
    height: 160px;
    margin: 0;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--accent);
    box-shadow: 0 0 0 7px var(--surface-soft);
  }
  .portrait img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ---- sections ---- */
  .section-title {
    margin: 0 0 18px;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    color: var(--muted);
  }

  .facts {
    margin: 0;
  }
  .fact {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    padding: 15px 0;
    border-top: 1px solid var(--line);
  }
  .fact:last-child { border-bottom: 1px solid var(--line); }
  .fact dt {
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    flex: none;
  }
  .fact dd {
    margin: 0;
    font-size: 1.02rem;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .fact dd a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 1px;
    transition: color .2s ease, border-color .2s ease;
  }
  .fact dd a:hover,
  .fact dd a:focus-visible {
    color: var(--accent-deep);
    border-color: var(--accent-deep);
    outline: none;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .chips li {
    padding: 9px 20px;
    font-size: 0.95rem;
    color: var(--accent-deep);
    background: var(--surface-soft);
    border: 1px solid transparent;
    border-radius: 999px;
    transition: border-color .2s ease, transform .2s ease;
  }
  .chips li:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  /* ---- footer ---- */
  .foot {
    margin: 0;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .page { padding: 44px 20px 40px; gap: 40px; }
    .hero { flex-direction: column; align-items: flex-start; gap: 26px; }
    .portrait { order: -1; width: 128px; height: 128px; }
    .fact { flex-direction: column; gap: 4px; }
    .fact dd { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    .chips li, .fact dd a { transition: none; }
  }
</style>
