<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<style>
  :root {
    --bg: #F1F8F4;
    --bg-glow: rgba(120, 190, 155, 0.18);
    --panel: #FFFFFF;
    --board: #E2EFE7;
    --cell: #D6E7DD;
    --ink: #24382C;
    --muted: #7C9086;
    --accent: #3E9D6B;
    --accent-ink: #FFFFFF;
    --line: rgba(62, 157, 107, 0.16);
    --shadow: 0 10px 30px -12px rgba(36, 70, 52, 0.25);

    --move-ms: 110ms;
    --gap: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141C18;
      --bg-glow: rgba(90, 180, 140, 0.10);
      --panel: #1D2721;
      --board: #223029;
      --cell: #2B3B32;
      --ink: #E2EDE6;
      --muted: #8CA396;
      --accent: #4FAE7D;
      --accent-ink: #0E1712;
      --line: rgba(120, 200, 165, 0.18);
      --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 40px;
    background:
      radial-gradient(circle at 50% 0%, var(--bg-glow), transparent 62%),
      var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei",
                 "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- 顶部 ---------- */
  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-size: 2.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
  }
  .sub {
    margin: 6px 0 0;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .scores {
    display: flex;
    gap: 8px;
    flex: none;
  }
  .score {
    position: relative;
    min-width: 76px;
    padding: 7px 12px 9px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    text-align: center;
  }
  .score .label {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1px;
  }
  .score .value {
    display: block;
    font-size: 1.22rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .score .value.bump { animation: bump 220ms ease-out; }
  @keyframes bump {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.18); color: var(--accent); }
    100% { transform: scale(1); }
  }

  /* ---------- 工具栏 ---------- */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hint {
    margin: 0;
    flex: 1 1 130px;
    font-size: 0.8rem;
    line-height: 1.45;
    color: var(--muted);
  }
  button {
    flex: none;
    padding: 10px 20px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 120ms ease, filter 120ms ease;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: scale(0.96); }
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- 棋盘 ---------- */
  .board {
    position: relative;
    aspect-ratio: 1 / 1;
    padding: var(--gap);
    border-radius: 16px;
    background: var(--board);
    box-shadow: var(--shadow);
    touch-action: none;
    user-select: none;
  }
  .grid-bg {
    position: absolute;
    inset: var(--gap);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
  }
  .grid-bg i {
    display: block;
    border-radius: 9px;
    background: var(--cell);
  }
  .tile-layer {
    position: absolute;
    inset: var(--gap);
    container-type: inline-size;
    pointer-events: none;
  }

  /* 方块：transform 负责位移，独立的 scale 负责弹跳，互不冲突 */
  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: calc((100% - 3 * var(--gap)) / 4);
    height: calc((100% - 3 * var(--gap)) / 4);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transform: translate(
      calc(var(--c) * (100% + var(--gap))),
      calc(var(--r) * (100% + var(--gap)))
    );
    transition: transform var(--move-ms) ease-in-out;
    will-change: transform;
    background: var(--tbg, var(--cell));
    color: var(--tink, var(--ink));
  }

  .tile[data-d="1"] { font-size: 10.5cqi; }
  .tile[data-d="2"] { font-size: 9.5cqi; }
  .tile[data-d="3"] { font-size: 7.4cqi; }
  .tile[data-d="4"] { font-size: 5.9cqi; }

  .tile.appear { animation: appear 150ms ease-out; }
  @keyframes appear {
    from { scale: 0.2; }
    to   { scale: 1; }
  }
  .tile.pop { animation: pop 190ms ease-out; }
  @keyframes pop {
    0%   { scale: 1; }
    50%  { scale: 1.16; }
    100% { scale: 1; }
  }

  /* 数字配色：浅 → 深的薄荷绿渐变 */
  .tile[data-val="2"]    { --tbg: #E9F4EE; --tink: #35594A; }
  .tile[data-val="4"]    { --tbg: #D4EBDD; --tink: #2C5040; }
  .tile[data-val="8"]    { --tbg: #B4DEC6; --tink: #1E4133; }
  .tile[data-val="16"]   { --tbg: #8DCFA9; --tink: #FFFFFF; }
  .tile[data-val="32"]   { --tbg: #65BF8F; --tink: #FFFFFF; }
  .tile[data-val="64"]   { --tbg: #45A876; --tink: #FFFFFF; }
  .tile[data-val="128"]  { --tbg: #339466; --tink: #FFFFFF; }
  .tile[data-val="256"]  { --tbg: #257C55; --tink: #FFFFFF; }
  .tile[data-val="512"]  { --tbg: #1B6546; --tink: #FFFFFF; }
  .tile[data-val="1024"] { --tbg: #145138; --tink: #FFFFFF; }
  .tile[data-val="2048"] {
    --tbg: linear-gradient(140deg, #F4CB63, #E0A32E);
    --tink: #4A3410;
    box-shadow: 0 0 0 2px rgba(224, 163, 46, 0.45), 0 6px 18px -6px rgba(224, 163, 46, 0.7);
  }
  .tile[data-val="super"] { --tbg: #0E3D2A; --tink: #F4CB63; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tile[data-val="2"]  { --tbg: #2C3D34; --tink: #CFE3D7; }
    :root:not([data-theme="light"]) .tile[data-val="4"]  { --tbg: #35493E; --tink: #D8EADF; }
    :root:not([data-theme="light"]) .tile[data-val="8"]  { --tbg: #40604D; --tink: #E4F2E9; }
    :root:not([data-theme="light"]) .tile[data-val="16"] { --tbg: #4C7A5E; --tink: #FFFFFF; }
    :root:not([data-theme="light"]) .tile[data-val="32"] { --tbg: #55905F; --tink: #FFFFFF; }
  }

  /* ---------- 结束 / 胜利遮罩 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    border-radius: 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    text-align: center;
    z-index: 5;
  }
  .overlay[hidden] { display: none; }
  .overlay .title {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 800;
  }
  .overlay .desc {
    margin: 0 0 8px;
    font-size: 0.9rem;
    color: var(--muted);
  }

  /* ---------- AI 演示 ---------- */
  .actions {
    display: flex;
    gap: 8px;
    flex: none;
  }
  button.ghost {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  button.ghost:hover {
    border-color: var(--accent);
    filter: none;
  }

  .ai-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 9px 7px 14px;
    border-radius: 10px;
    background: var(--cell);
    border: 1px solid var(--line);
  }
  .ai-bar[hidden] { display: none; }
  .ai-status {
    font-size: 0.82rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .speeds { display: flex; gap: 3px; flex: none; }
  .speeds button {
    padding: 5px 13px;
    font-size: 0.78rem;
    font-weight: 500;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
  }
  .speeds button:hover { filter: none; color: var(--ink); }
  .speeds button.on {
    background: var(--panel);
    color: var(--accent);
    border-color: var(--line);
    font-weight: 600;
  }

  @media (max-width: 400px) {
    :root { --gap: 9px; }
    h1 { font-size: 2.1rem; }
    .score { min-width: 66px; padding: 6px 9px 8px; }
    .hint { font-size: 0.74rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition-duration: 1ms; }
    .tile.appear, .tile.pop, .score .value.bump { animation: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>2048</h1>
      <p class="sub">合并相同数字，凑出 2048</p>
    </div>
    <div class="scores">
      <div class="score">
        <span class="label">得分</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="score">
        <span class="label">最高</span>
        <span class="value" id="best">0</span>
      </div>
    </div>
  </header>

  <div class="bar">
    <p class="hint">方向键或 WASD 移动<br>手机在棋盘上滑动</p>
    <div class="actions">
      <button type="button" id="newBtn" class="ghost">新游戏</button>
      <button type="button" id="aiBtn">AI 操作示范</button>
    </div>
  </div>

  <div class="ai-bar" id="aiBar" hidden>
    <span class="ai-status" id="aiStatus">AI 正在演示…</span>
    <div class="speeds" role="group" aria-label="演示速度">
      <button type="button" data-ms="900">慢</button>
      <button type="button" data-ms="450" class="on">正常</button>
      <button type="button" data-ms="180">快</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="grid-bg" id="gridBg" aria-hidden="true"></div>
    <div class="tile-layer" id="tileLayer"></div>
    <div class="overlay" id="overlay" hidden>
      <p class="title" id="ovTitle"></p>
      <p class="desc" id="ovDesc"></p>
      <button type="button" id="ovBtn"></button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 4;
  var CELLS = SIZE * SIZE;
  var MOVE_MS = 110;

  var boardEl   = document.getElementById('board');
  var gridBgEl  = document.getElementById('gridBg');
  var layerEl   = document.getElementById('tileLayer');
  var scoreEl   = document.getElementById('score');
  var bestEl    = document.getElementById('best');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ovTitle');
  var ovDescEl  = document.getElementById('ovDesc');
  var ovBtnEl   = document.getElementById('ovBtn');
  var newBtnEl  = document.getElementById('newBtn');
  var aiBtnEl   = document.getElementById('aiBtn');
  var aiBarEl   = document.getElementById('aiBar');
  var aiStatusEl = document.getElementById('aiStatus');

  var cells = new Array(CELLS).fill(null);
  var tiles = {};              // id -> tile
  var nextId = 1;
  var score = 0;
  var best = 0;
  var busy = false;
  var pendingDir = null;
  var gameOver = false;
  var reached2048 = false;
  var keepPlaying = false;

  /* ---------------- 存储（失败也不影响游戏） ---------------- */
  function loadBest() {
    try {
      var v = window.localStorage.getItem('game2048.best');
      return v ? parseInt(v, 10) || 0 : 0;
    } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { window.localStorage.setItem('game2048.best', String(v)); } catch (e) {}
  }

  /* ---------------- 棋盘底格 ---------------- */
  for (var i = 0; i < CELLS; i++) {
    gridBgEl.appendChild(document.createElement('i'));
  }

  /* ---------------- 方块 ---------------- */
  function paint(tile) {
    var el = tile.el;
    el.textContent = tile.value;
    el.dataset.val = tile.value > 2048 ? 'super' : String(tile.value);
    var d = String(tile.value).length;
    el.dataset.d = String(d > 4 ? 4 : d);
  }

  function createTile(value, r, c) {
    var el = document.createElement('div');
    el.className = 'tile appear';
    el.style.setProperty('--r', r);
    el.style.setProperty('--c', c);

    var tile = { id: nextId++, value: value, r: r, c: c, el: el };
    paint(tile);
    layerEl.appendChild(el);
    tiles[tile.id] = tile;
    return tile;
  }

  function place(tile) {
    tile.el.style.setProperty('--r', tile.r);
    tile.el.style.setProperty('--c', tile.c);
  }

  function removeTile(tile) {
    if (tile.el.parentNode) tile.el.parentNode.removeChild(tile.el);
    delete tiles[tile.id];
  }

  function retarget(tile, idx) {
    tile.r = Math.floor(idx / SIZE);
    tile.c = idx % SIZE;
  }

  /* ---------------- 得分 ---------------- */
  function bumpScoreNode(node) {
    node.classList.remove('bump');
    void node.offsetWidth;
    node.classList.add('bump');
  }

  function updateScore(gained) {
    scoreEl.textContent = score;
    if (gained) bumpScoreNode(scoreEl);
    if (score > best) {
      best = score;
      saveBest(best);
      bestEl.textContent = best;
      bumpScoreNode(bestEl);
    }
  }

  /* ---------------- 新游戏 ---------------- */
  function newGame() {
    var ks = Object.keys(tiles);
    for (var i = 0; i < ks.length; i++) removeTile(tiles[ks[i]]);

    cells = new Array(CELLS).fill(null);
    score = 0;
    busy = false;
    pendingDir = null;
    gameOver = false;
    reached2048 = false;
    keepPlaying = false;
    hideOverlay();

    addRandomTile();
    addRandomTile();
    scoreEl.textContent = '0';
  }

  function addRandomTile() {
    var empty = [];
    for (var i = 0; i < CELLS; i++) if (!cells[i]) empty.push(i);
    if (!empty.length) return null;

    var idx = empty[Math.floor(Math.random() * empty.length)];
    var value = Math.random() < 0.9 ? 2 : 4;
    var tile = createTile(value, Math.floor(idx / SIZE), idx % SIZE);
    cells[idx] = tile;
    return tile;
  }

  /* ---------------- 移动 ---------------- */
  // 生成 4 条「线」，每条按前进方向从近到远排列
  function linesFor(dir) {
    var lines = [];
    for (var i = 0; i < SIZE; i++) {
      var line = [];
      for (var j = 0; j < SIZE; j++) {
        var r, c;
        if (dir === 'left')       { r = i; c = j; }
        else if (dir === 'right') { r = i; c = SIZE - 1 - j; }
        else if (dir === 'up')    { r = j; c = i; }
        else                      { r = SIZE - 1 - j; c = i; }
        line.push(r * SIZE + c);
      }
      lines.push(line);
    }
    return lines;
  }

  function move(dir) {
    var lines = linesFor(dir);
    var moving = [];
    var merges = [];
    var moved = false;
    var gained = 0;

    for (var li = 0; li < lines.length; li++) {
      var line = lines[li];
      var seq = [];
      for (var k = 0; k < line.length; k++) {
        if (cells[line[k]]) seq.push(cells[line[k]]);
      }

      var write = 0;
      var i = 0;
      while (i < seq.length) {
        var tile = seq[i];
        var next = seq[i + 1];
        var targetIdx = line[write];

        if (next && next.value === tile.value) {
          // 合并：两块都滑向同一格
          cells[tile.r * SIZE + tile.c] = null;
          cells[next.r * SIZE + next.c] = null;   // 清除被吞并方块的旧格
          retarget(tile, targetIdx);
          cells[targetIdx] = tile;

          next.r = tile.r;
          next.c = tile.c;

          moving.push(tile);
          moving.push(next);
          merges.push({ survivor: tile, absorbed: next, value: tile.value * 2 });
          gained += tile.value * 2;
          moved = true;
          i += 2;
        } else {
          if (tile.r * SIZE + tile.c !== targetIdx) moved = true;
          cells[tile.r * SIZE + tile.c] = null;
          retarget(tile, targetIdx);
          cells[targetIdx] = tile;
          moving.push(tile);
          i += 1;
        }
        write++;
      }
    }

    if (!moved) return;

    for (var m = 0; m < moving.length; m++) place(moving[m]);

    busy = true;

    window.setTimeout(function () {
      for (var n = 0; n < merges.length; n++) {
        var mg = merges[n];
        removeTile(mg.absorbed);
        mg.survivor.value = mg.value;
        paint(mg.survivor);
        mg.survivor.el.classList.remove('pop');
        void mg.survivor.el.offsetWidth;
        mg.survivor.el.classList.add('pop');
        if (mg.value === 2048) reached2048 = true;
      }

      if (gained) {
        score += gained;
        updateScore(gained);
      }

      addRandomTile();
      busy = false;

      if (reached2048 && !keepPlaying) {
        showOverlay('win');
      } else if (isGameOver()) {
        gameOver = true;
        showOverlay('lose');
      }

      if (pendingDir !== null) {
        var d = pendingDir;
        pendingDir = null;
        if (!gameOver && !(reached2048 && !keepPlaying)) move(d);
      }
    }, MOVE_MS);
  }

  function isGameOver() {
    for (var i = 0; i < CELLS; i++) {
      var t = cells[i];
      if (!t) return false;
      var c = i % SIZE;
      var r = Math.floor(i / SIZE);
      if (c < SIZE - 1 && cells[i + 1] && cells[i + 1].value === t.value) return false;
      if (r < SIZE - 1 && cells[i + SIZE] && cells[i + SIZE].value === t.value) return false;
    }
    return true;
  }

  /* ---------------- 遮罩 ---------------- */
  function showOverlay(kind) {
    if (kind === 'win') {
      ovTitleEl.textContent = '达成 2048！';
      ovDescEl.textContent = '还能继续挑战更高的数字。';
      ovBtnEl.textContent = '继续挑战';
    } else {
      ovTitleEl.textContent = '无路可走了';
      ovDescEl.textContent = '本局得分 ' + score + '，再来一次？';
      ovBtnEl.textContent = '再来一局';
    }
    ovBtnEl.dataset.kind = kind;
    overlayEl.hidden = false;
  }
  function hideOverlay() { overlayEl.hidden = true; }

  function overlayAction() {
    if (ovBtnEl.dataset.kind === 'win') {
      keepPlaying = true;
      hideOverlay();
      if (pendingDir !== null) {
        var d = pendingDir; pendingDir = null; move(d);
      }
    } else {
      newGame();
    }
  }

  /* ================= AI 演示 =================
     策略：expectimax 搜索 + 启发式评估。
     棋盘用「2 的指数」表示（0 表示空格），比如 2 -> 1、2048 -> 11。
     ============================================ */

  var AI_DIRS = ['left', 'right', 'up', 'down'];   // 与 moveGrid 的方向编号一致

  // moveGrid 的草稿数组：预分配，避免每次调用都新建数组（搜索时调用极频繁）
  var MG_LINE = [0, 0, 0, 0];
  var MG_RES = [0, 0, 0, 0];

  // 在纯数组上模拟一步移动，返回新棋盘；无法移动时返回 null
  function moveGrid(g, dir) {
    var out = new Uint8Array(16);
    var i, j, n, m, r, c;

    for (i = 0; i < 4; i++) {
      for (j = 0; j < 4; j++) {
        if (dir === 0)      { r = i;     c = j; }
        else if (dir === 1) { r = i;     c = 3 - j; }
        else if (dir === 2) { r = j;     c = i; }
        else                { r = 3 - j; c = i; }
        MG_LINE[j] = g[r * 4 + c];
      }

      // 压掉空格（原地压缩，复用同一个数组）
      n = 0;
      for (j = 0; j < 4; j++) if (MG_LINE[j]) MG_LINE[n++] = MG_LINE[j];

      // 相邻同值合并
      m = 0;
      for (j = 0; j < n; j++) {
        if (j + 1 < n && MG_LINE[j] === MG_LINE[j + 1]) {
          MG_RES[m++] = MG_LINE[j] + 1;
          j++;
        } else {
          MG_RES[m++] = MG_LINE[j];
        }
      }
      while (m < 4) MG_RES[m++] = 0;

      for (j = 0; j < 4; j++) {
        if (dir === 0)      { r = i;     c = j; }
        else if (dir === 1) { r = i;     c = 3 - j; }
        else if (dir === 2) { r = j;     c = i; }
        else                { r = 3 - j; c = i; }
        out[r * 4 + c] = MG_RES[j];
      }
    }

    for (var x = 0; x < 16; x++) if (out[x] !== g[x]) return out;
    return null;
  }

  // 查表把指数还原成真实数值：TILE_VAL[r] = 2^r
  // 关键：所有启发项都用「真实数值」而不是 log2 指数，
  // 这样 1024 和 512 相差 16 倍，大块的位置才会真正压倒一切。
  var TILE_VAL = [];
  for (var tv = 0; tv < 32; tv++) TILE_VAL.push(Math.pow(2, tv));

  function countEmpty(g) {
    var n = 0;
    for (var i = 0; i < 16; i++) if (!g[i]) n++;
    return n;
  }

  // 四个角落出发的蛇形路径（大数应该沿这条路径从角落开始依次变小）
  var SNAKE_PATHS = [
    [0, 1, 2, 3, 7, 6, 5, 4, 8, 9, 10, 11, 15, 14, 13, 12],   // 左上角起步
    [3, 2, 1, 0, 4, 5, 6, 7, 11, 10, 9, 8, 12, 13, 14, 15],   // 右上角起步
    [12, 13, 14, 15, 11, 10, 9, 8, 4, 5, 6, 7, 3, 2, 1, 0],   // 左下角起步
    [15, 14, 13, 12, 8, 9, 10, 11, 7, 6, 5, 4, 0, 1, 2, 3]    // 右下角起步
  ];
  var SNAKE_W = [];
  for (var sw = 0; sw < 16; sw++) SNAKE_W.push(Math.pow(0.5, sw));   // 越靠路径开头权重越大

  // 蛇形评分：取四个角落里最好的一个。完美蛇形棋盘约等于 maxV
  function snakeScore(g) {
    var best = -Infinity;
    for (var p = 0; p < 4; p++) {
      var path = SNAKE_PATHS[p], s = 0;
      for (var k = 0; k < 16; k++) {
        var v = g[path[k]];
        if (v) s += TILE_VAL[v] * SNAKE_W[k];
      }
      if (s > best) best = s;
    }
    return best;
  }

  // 平滑度：相邻格数值越接近越好（用真实数值）
  function smoothnessScore(g) {
    var s = 0;
    for (var r = 0; r < 4; r++) {
      for (var c = 0; c < 4; c++) {
        var v = g[r * 4 + c];
        if (!v) continue;
        var av = TILE_VAL[v];
        if (c < 3 && g[r * 4 + c + 1]) s -= Math.abs(av - TILE_VAL[g[r * 4 + c + 1]]);
        if (r < 3 && g[(r + 1) * 4 + c]) s -= Math.abs(av - TILE_VAL[g[(r + 1) * 4 + c]]);
      }
    }
    return s;
  }

  // 一条线的锯齿程度：总落差 - 最大跨度。完全单调时为 0，越来回横跳越负。
  // 与方向无关（递增递减都算单调），再除以该线自己的最大块做归一化。
  function lineMono(vals) {
    if (vals.length < 2) return 0;
    var tv = 0, mn = vals[0], mx = vals[0];
    for (var i = 0; i + 1 < vals.length; i++) {
      tv += Math.abs(vals[i + 1] - vals[i]);
      if (vals[i + 1] < mn) mn = vals[i + 1];
      if (vals[i + 1] > mx) mx = vals[i + 1];
    }
    return -(tv - (mx - mn)) / mx;
  }

  // 全盘单调性惩罚，范围约 [-16, 0]，0 表示每一行每一列都是单调的
  function monotonicityScore(g) {
    var total = 0, k, v;
    for (var r = 0; r < 4; r++) {
      var rowVals = [];
      for (var c = 0; c < 4; c++) { v = g[r * 4 + c]; if (v) rowVals.push(TILE_VAL[v]); }
      total += lineMono(rowVals);
    }
    for (var c2 = 0; c2 < 4; c2++) {
      var colVals = [];
      for (var r2 = 0; r2 < 4; r2++) { v = g[r2 * 4 + c2]; if (v) colVals.push(TILE_VAL[v]); }
      total += lineMono(colVals);
    }
    return total;
  }

  // 启发式权重。这组数是拿 16 个配置各跑 16 局做网格搜索挑出来的，
  // 通关率 16/16；调参时发现蛇形权重过高（2500+）反而变差（棋盘太僵硬）。
  var AI_W = {
    empty:   50,    // 每个空格
    snake: 1800,    // 蛇形贴合度（已除以最大块，0~2）
    mono:   250,    // 单调性惩罚（已按行归一化，-16~0）
    smooth: 150,    // 平滑度（已除以最大块，负值）
    max:     20     // 轻微鼓励合成更大块
  };

  function evaluateGrid(g) {
    var i, empty = 0, maxRank = 0;
    for (i = 0; i < 16; i++) { if (!g[i]) empty++; else if (g[i] > maxRank) maxRank = g[i]; }
    if (!maxRank) return 0;

    var maxV = TILE_VAL[maxRank];

    return AI_W.empty * empty
         + AI_W.snake * (snakeScore(g) / maxV)
         + AI_W.mono * monotonicityScore(g)
         + AI_W.smooth * (smoothnessScore(g) / maxV)
         + AI_W.max * maxRank;
  }

  // 随机节点用的空位下标缓冲。按搜索深度分层，避免递归时上下层互相覆盖。
  var EMPTY_BUF = [];
  function emptyBuf(depth) {
    var b = EMPTY_BUF[depth];
    if (!b) b = EMPTY_BUF[depth] = new Int32Array(16);
    return b;
  }

  function expectimax(g, depth, isPlayer) {
    if (depth <= 0) return evaluateGrid(g);

    if (isPlayer) {
      var best = -Infinity;
      for (var d = 0; d < 4; d++) {
        var next = moveGrid(g, d);
        if (!next) continue;
        var v = expectimax(next, depth - 1, false);
        if (v > best) best = v;
      }
      return best === -Infinity ? evaluateGrid(g) - 1e6 : best;
    }

    // 随机节点：在空位生成 2（90%）或 4（10%）
    var empties = emptyBuf(depth);
    var n = 0, i;
    for (i = 0; i < 16; i++) if (!g[i]) empties[n++] = i;

    if (n === 0) return expectimax(g, depth - 1, true);

    var p2 = 0.9 / n;
    var p4 = 0.1 / n;
    var sum = 0;
    for (var e = 0; e < n; e++) {
      var idx = empties[e];
      g[idx] = 1;                                   // 就地放一个 2
      sum += p2 * expectimax(g, depth - 1, true);
      g[idx] = 2;                                   // 就地换成一个 4
      sum += p4 * expectimax(g, depth - 1, true);
      g[idx] = 0;                                   // 还原
    }
    return sum;
  }

  function gridFromCells() {
    var g = new Uint8Array(16);
    for (var i = 0; i < 16; i++) {
      var t = cells[i];
      if (t) g[i] = Math.log2(t.value);
    }
    return g;
  }

  // 搜索层数（空格多时分支多、算得慢，就搜浅一点）
  var AI_DEPTH_OPEN = 4;
  var AI_DEPTH_TIGHT = 6;

  // 返回最佳方向名，无处可走时返回 null
  function aiChooseMove() {
    var g = gridFromCells();
    var depth = countEmpty(g) >= 6 ? AI_DEPTH_OPEN : AI_DEPTH_TIGHT;

    var best = -Infinity, bestDir = -1;
    for (var d = 0; d < 4; d++) {
      var next = moveGrid(g, d);
      if (!next) continue;
      var v = expectimax(next, depth - 1, false);
      if (v > best) { best = v; bestDir = d; }
    }
    return bestDir < 0 ? null : AI_DIRS[bestDir];
  }

  /* ---------------- 演示循环 ---------------- */
  var aiRunning = false;
  var aiTimer = null;
  var aiPace = 450;
  var aiSteps = 0;

  function aiTick() {
    aiTimer = null;
    if (!aiRunning) return;
    if (gameOver || (reached2048 && !keepPlaying)) { stopDemo(); return; }
    if (busy) { aiTimer = window.setTimeout(aiTick, 60); return; }

    var t0 = Date.now();
    var dir = aiChooseMove();
    var spent = Date.now() - t0;
    if (!dir) { stopDemo(); return; }

    aiSteps++;
    aiStatusEl.textContent = 'AI 正在演示 · 第 ' + aiSteps + ' 步';
    move(dir);
    // 扣掉思考耗时，让每步的观感节奏稳定在 aiPace 附近，不会忽快忽慢
    aiTimer = window.setTimeout(aiTick, Math.max(80, aiPace - spent));
  }

  function startDemo() {
    stopDemo();
    newGame();
    aiSteps = 0;
    aiRunning = true;
    aiBtnEl.textContent = '停止演示';
    aiBarEl.hidden = false;
    aiStatusEl.textContent = 'AI 正在演示 · 准备中';
    aiTimer = window.setTimeout(aiTick, 700);   // 先停一下，让人看清起始棋盘
  }

  function stopDemo() {
    aiRunning = false;
    if (aiTimer) { window.clearTimeout(aiTimer); aiTimer = null; }
    pendingDir = null;
    aiBtnEl.textContent = 'AI 操作示范';
    aiBarEl.hidden = true;
  }

  /* ---------------- 输入 ---------------- */
  function requestMove(dir) {
    if (aiRunning) stopDemo();        // 玩家一操作就接管
    if (gameOver) return;
    if (reached2048 && !keepPlaying) return;
    if (busy) { pendingDir = dir; return; }
    move(dir);
  }

  var KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var dir = KEYS[e.key];
    if (!dir) return;
    e.preventDefault();
    requestMove(dir);
  }, { passive: false });

  // 触摸滑动
  var startX = 0, startY = 0, tracking = false;

  boardEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  boardEl.addEventListener('touchmove', function (e) {
    if (tracking) e.preventDefault();
  }, { passive: false });

  boardEl.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;
    requestMove(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });

  // 鼠标拖动（桌面端也能滑）
  var mouseDown = false;
  boardEl.addEventListener('mousedown', function (e) {
    mouseDown = true;
    startX = e.clientX;
    startY = e.clientY;
  });
  window.addEventListener('mouseup', function (e) {
    if (!mouseDown) return;
    mouseDown = false;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 32) return;
    requestMove(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  newBtnEl.addEventListener('click', function () {
    stopDemo();
    newGame();
  });
  ovBtnEl.addEventListener('click', overlayAction);

  aiBtnEl.addEventListener('click', function () {
    if (aiRunning) stopDemo(); else startDemo();
  });

  var speedBtns = aiBarEl.querySelectorAll('.speeds button');
  for (var si = 0; si < speedBtns.length; si++) {
    speedBtns[si].addEventListener('click', function () {
      aiPace = parseInt(this.dataset.ms, 10) || 450;
      for (var k = 0; k < speedBtns.length; k++) speedBtns[k].classList.remove('on');
      this.classList.add('on');
    });
  }

  /* ---------------- 启动 ---------------- */
  best = loadBest();
  bestEl.textContent = best;
  newGame();
})();
</script>
</body>
</html>
