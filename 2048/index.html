<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048——合成上交大！</title>
<style>
  :root {
    /* 中性暖灰底，灰里掺了一点交大红的味道 */
    --bg: #F6F5F3;
    --glow: rgba(166, 25, 46, 0.06);
    --panel: #FFFFFF;
    --board: #E9E6E2;
    --cell: #DED9D3;
    --ink: #26221F;
    --muted: #857D75;
    --accent: #A6192E;
    --accent-ink: #FFFFFF;
    --line: rgba(38, 34, 31, 0.10);
    --shadow: 0 12px 32px -14px rgba(38, 34, 31, 0.34);
    --badge-shadow: 0 1px 3px rgba(28, 20, 14, 0.18), 0 0 0 1px rgba(28, 20, 14, 0.05);

    --move-ms: 110ms;
    --gap: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161514;
      --glow: rgba(200, 60, 80, 0.11);
      --panel: #232120;
      --board: #1F1D1B;
      --cell: #2A2724;
      --ink: #EDE9E4;
      --muted: #9A918A;
      --accent: #C42B42;
      --accent-ink: #FFFFFF;
      --line: rgba(237, 233, 228, 0.12);
      --shadow: 0 12px 32px -14px rgba(0, 0, 0, 0.72);
      --badge-shadow: 0 1px 4px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.30);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 40px;
    background:
      radial-gradient(130% 55% at 50% -12%, var(--glow), transparent 62%),
      var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei",
                 "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* 页首一道交大红细线，点到为止 */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    z-index: 20;
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- 顶部 ---------- */
  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { flex: 1 1 auto; min-width: 0; }
  .eyebrow {
    margin: 0 0 5px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-size: 2.05rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.05;
    color: var(--ink);
  }
  .sub {
    margin: 7px 0 0;
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--muted);
  }
  .scores {
    display: flex;
    gap: 8px;
    flex: none;
  }
  .score {
    min-width: 72px;
    padding: 7px 11px 9px;
    border-radius: 11px;
    background: var(--panel);
    border: 1px solid var(--line);
    text-align: center;
  }
  .score .label {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1px;
  }
  .score .value {
    display: block;
    font-size: 1.18rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .score .value.bump { animation: bump 220ms ease-out; }
  @keyframes bump {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.18); color: var(--accent); }
    100% { transform: scale(1); }
  }

  /* ---------- 工具栏 ---------- */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hint {
    margin: 0;
    flex: 1 1 130px;
    font-size: 0.78rem;
    line-height: 1.45;
    color: var(--muted);
  }
  button {
    flex: none;
    padding: 10px 20px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 120ms ease, filter 120ms ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(0.96); }
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- 棋盘 ---------- */
  .board {
    position: relative;
    aspect-ratio: 1 / 1;
    padding: var(--gap);
    border-radius: 18px;
    background: var(--board);
    box-shadow: var(--shadow);
    touch-action: none;
    user-select: none;
  }
  .grid-bg {
    position: absolute;
    inset: var(--gap);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
  }
  .grid-bg i {
    display: block;
    border-radius: 11px;
    background: var(--cell);
  }
  .tile-layer {
    position: absolute;
    inset: var(--gap);
    container-type: inline-size;
    pointer-events: none;
  }

  /* 方块：transform 负责位移，独立的 scale 负责弹跳，互不冲突 */
  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: calc((100% - 3 * var(--gap)) / 4);
    height: calc((100% - 3 * var(--gap)) / 4);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transform: translate(
      calc(var(--c) * (100% + var(--gap))),
      calc(var(--r) * (100% + var(--gap)))
    );
    transition: transform var(--move-ms) ease-in-out;
    will-change: transform;
    background: var(--tbg, var(--cell));
    color: var(--tink, var(--ink));
  }

  /* 校徽：统一烘成白色圆牌，浅色底和深色底上都能看清 */
  .tile .logo {
    width: 82%;
    height: 82%;
    display: block;
    border-radius: 50%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    box-shadow: var(--badge-shadow);
  }

  /* 数字兜底（合过 4096 之后才有），样式沿用原来的字号阶梯 */
  .tile[data-d="1"] { font-size: 10.5cqi; }
  .tile[data-d="2"] { font-size: 9.5cqi; }
  .tile[data-d="3"] { font-size: 7.4cqi; }
  .tile[data-d="4"] { font-size: 5.9cqi; }
  .tile[data-val="digit"] { --tbg: var(--cell); --tink: var(--ink); }

  .tile.appear { animation: appear 150ms ease-out; }
  @keyframes appear {
    from { scale: 0.2; }
    to   { scale: 1; }
  }
  .tile.pop { animation: pop 190ms ease-out; }
  @keyframes pop {
    0%   { scale: 1; }
    50%  { scale: 1.16; }
    100% { scale: 1; }
  }

  /* 方块底色：中性暖灰台阶，级别越高越深，校徽始终压在浅色圆牌上 */
  .tile[data-val="2"]    { --tbg: #F4F2EF; }
  .tile[data-val="4"]    { --tbg: #EDEAE5; }
  .tile[data-val="8"]    { --tbg: #E6E1DA; }
  .tile[data-val="16"]   { --tbg: #DED7CE; }
  .tile[data-val="32"]   { --tbg: #D5CBC1; }
  .tile[data-val="64"]   { --tbg: #CBBFB2; }
  .tile[data-val="128"]  { --tbg: #C0B2A4; }
  .tile[data-val="256"]  { --tbg: #B5A495; }
  .tile[data-val="512"]  { --tbg: #A99686; }
  .tile[data-val="1024"] { --tbg: #9D8977; }
  .tile[data-val="2048"] {
    --tbg: linear-gradient(152deg, #C22B41, #8B1123);
    --ring: rgba(166, 25, 46, 0.5);
  }
  /* 4096 用上高二中校徽本身的绿，和 2048 的交大红各占一头 */
  .tile[data-val="4096"] {
    --tbg: linear-gradient(152deg, #128A46, #004E20);
    --ring: rgba(0, 144, 64, 0.45);
  }
  .tile[data-val="2048"], .tile[data-val="4096"] {
    box-shadow: 0 0 0 2px var(--ring), 0 10px 22px -10px var(--ring);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tile[data-val="2"]    { --tbg: #2B2926; }
    :root:not([data-theme="light"]) .tile[data-val="4"]    { --tbg: #33302C; }
    :root:not([data-theme="light"]) .tile[data-val="8"]    { --tbg: #3C3833; }
    :root:not([data-theme="light"]) .tile[data-val="16"]   { --tbg: #46413A; }
    :root:not([data-theme="light"]) .tile[data-val="32"]   { --tbg: #514A42; }
    :root:not([data-theme="light"]) .tile[data-val="64"]   { --tbg: #5C544A; }
    :root:not([data-theme="light"]) .tile[data-val="128"]  { --tbg: #685E52; }
    :root:not([data-theme="light"]) .tile[data-val="256"]  { --tbg: #74685A; }
    :root:not([data-theme="light"]) .tile[data-val="512"]  { --tbg: #817262; }
    :root:not([data-theme="light"]) .tile[data-val="1024"] { --tbg: #8E7D6B; }
    :root:not([data-theme="light"]) .tile[data-val="2048"] {
      --tbg: linear-gradient(152deg, #A81E35, #690E1E);
      --ring: rgba(196, 43, 66, 0.55);
    }
    :root:not([data-theme="light"]) .tile[data-val="4096"] {
      --tbg: linear-gradient(152deg, #0C7A3D, #003F1A);
      --ring: rgba(34, 176, 92, 0.45);
    }
  }

  /* ---------- 合成进度（12 枚校徽） ---------- */
  .chain {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 2px;
  }
  .chain .label {
    flex: none;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  .chain .now {
    flex: none;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--accent);
  }
  .chain-list {
    flex: 1 1 auto;
    display: flex;
    gap: 5px;
    margin: 0;
    padding: 0;
    list-style: none;
    min-width: 0;
  }
  .chain-list li {
    flex: 1 1 0;
    min-width: 0;
    aspect-ratio: 1 / 1;
  }
  .chain-list img {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    filter: grayscale(1);
    opacity: 0.28;
    transition: filter 320ms ease, opacity 320ms ease, transform 320ms ease;
  }
  .chain-list li.got img {
    filter: none;
    opacity: 1;
  }
  /* 上高二中是压轴彩蛋，合出上交大之前先盖住，免得提前剧透 */
  .chain-list li.locked { position: relative; }
  .chain-list li.locked img { visibility: hidden; }
  .chain-list li.locked::after {
    content: "?";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--cell);
    color: var(--muted);
    font-size: 0.7rem;
    font-weight: 700;
  }

  /* ---------- 结束 / 胜利遮罩 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    border-radius: 18px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    text-align: center;
    z-index: 5;
  }
  .overlay[hidden] { display: none; }
  .overlay .title {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 800;
  }
  .overlay .desc {
    margin: 0 0 8px;
    font-size: 0.9rem;
    color: var(--muted);
  }

  /* ---------- AI 演示 ---------- */
  .actions {
    display: flex;
    gap: 8px;
    flex: none;
  }
  button.ghost {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  button.ghost:hover {
    border-color: var(--accent);
    filter: none;
  }

  .ai-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 9px 7px 14px;
    border-radius: 10px;
    background: var(--cell);
    border: 1px solid var(--line);
  }
  .ai-bar[hidden] { display: none; }
  .ai-status {
    font-size: 0.82rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .speeds { display: flex; gap: 3px; flex: none; }
  .speeds button {
    padding: 5px 13px;
    font-size: 0.78rem;
    font-weight: 500;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
  }
  .speeds button:hover { filter: none; color: var(--ink); }
  .speeds button.on {
    background: var(--panel);
    color: var(--accent);
    border-color: var(--line);
    font-weight: 600;
  }

  @media (max-width: 400px) {
    :root { --gap: 9px; }
    /* 分数位数一多就会把标题挤到换行，索性让页头能在窄屏上折行 */
    .top { flex-wrap: wrap; align-items: flex-start; row-gap: 12px; }
    /* 折行后各自靠右，和下面的按钮对齐成一条右轨 */
    .scores, .actions { margin-left: auto; }
    h1 { font-size: 1.75rem; }
    .eyebrow { font-size: 0.64rem; letter-spacing: 0.24em; }
    .sub { font-size: 0.74rem; }
    .score { min-width: 62px; padding: 6px 8px 8px; }
    .score .value { font-size: 1.05rem; }
    .hint { font-size: 0.72rem; }
    /* 窄屏给 12 枚校徽腾点地方，两头的文字收一收 */
    .chain .label { font-size: 0.6rem; letter-spacing: 0.06em; }
    .chain .now { font-size: 0.64rem; }
    .chain-list li.locked::after { font-size: 0.55rem; }
    .chain-list { gap: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition-duration: 1ms; }
    .tile.appear, .tile.pop, .score .value.bump { animation: none; }
    .chain-list img { transition: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">2048</p>
      <h1>合成上交大！</h1>
      <p class="sub">同级校徽两两合并 · 合出上交大即通关</p>
    </div>
    <div class="scores">
      <div class="score">
        <span class="label">得分</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="score">
        <span class="label">最高</span>
        <span class="value" id="best">0</span>
      </div>
    </div>
  </header>

  <div class="bar">
    <p class="hint">方向键或 WASD 移动<br>手机在棋盘上滑动</p>
    <div class="actions">
      <button type="button" id="newBtn" class="ghost">新游戏</button>
      <button type="button" id="aiBtn">AI 操作示范</button>
    </div>
  </div>

  <div class="ai-bar" id="aiBar" hidden>
    <span class="ai-status" id="aiStatus">AI 正在演示…</span>
    <div class="speeds" role="group" aria-label="演示速度">
      <button type="button" data-ms="900">慢</button>
      <button type="button" data-ms="450" class="on">正常</button>
      <button type="button" data-ms="180">快</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="grid-bg" id="gridBg" aria-hidden="true"></div>
    <div class="tile-layer" id="tileLayer"></div>
    <div class="overlay" id="overlay" hidden>
      <p class="title" id="ovTitle"></p>
      <p class="desc" id="ovDesc"></p>
      <button type="button" id="ovBtn"></button>
    </div>
  </div>

  <div class="chain">
    <span class="label">合成进度</span>
    <ol class="chain-list" id="chainList"></ol>
    <span class="now" id="chainNow"></span>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 4;
  var CELLS = SIZE * SIZE;
  var MOVE_MS = 110;

  var boardEl   = document.getElementById('board');
  var gridBgEl  = document.getElementById('gridBg');
  var layerEl   = document.getElementById('tileLayer');
  var scoreEl   = document.getElementById('score');
  var bestEl    = document.getElementById('best');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ovTitle');
  var ovDescEl  = document.getElementById('ovDesc');
  var ovBtnEl   = document.getElementById('ovBtn');
  var newBtnEl  = document.getElementById('newBtn');
  var aiBtnEl   = document.getElementById('aiBtn');
  var aiBarEl   = document.getElementById('aiBar');
  var aiStatusEl = document.getElementById('aiStatus');
  var chainListEl = document.getElementById('chainList');
  var chainNowEl  = document.getElementById('chainNow');

  var cells = new Array(CELLS).fill(null);
  var tiles = {};              // id -> tile
  var nextId = 1;
  var score = 0;
  var best = 0;
  var busy = false;
  var pendingDir = null;
  var gameOver = false;
  var reached2048 = false;
  var reached4096 = false;
  var showed4096 = false;
  var keepPlaying = false;

  /* ---------------- 校徽 ----------------
     键是「2 的指数」：1 -> 2 分格的校徽，12 -> 4096 分格。
     图片已烘成白色圆牌（圆形外透明），所以方块底色怎么变都压得住。
     ------------------------------------- */

  };
  var LOGO_NAME = {
    1: "中国人民大学",
    2: "哈尔滨工业大学",
    3: "南京大学",
    4: "中国科学技术大学",
    5: "浙江大学",
    6: "清华大学",
    7: "北京大学",
    8: "华东师范大学",
    9: "同济大学",
    10: "复旦大学",
    11: "上海交通大学",
    12: "上高二中"
  };
  /* @LOGOS:END */

  var LOGO_MAX = 12;           // 12 档正好到 4096

  function rankOf(value) { return Math.round(Math.log2(value)); }

  /* ---------------- 存储（失败也不影响游戏） ---------------- */
  function loadBest() {
    try {
      var v = window.localStorage.getItem('game2048.best');
      return v ? parseInt(v, 10) || 0 : 0;
    } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { window.localStorage.setItem('game2048.best', String(v)); } catch (e) {}
  }

  /* ---------------- 棋盘底格 ---------------- */
  for (var i = 0; i < CELLS; i++) {
    gridBgEl.appendChild(document.createElement('i'));
  }

  /* ---------------- 合成进度条 ---------------- */
  var chainItems = [], chainImgs = [];
  (function buildChain() {
    for (var k = 1; k <= LOGO_MAX; k++) {
      var li = document.createElement('li');
      var img = document.createElement('img');
      img.src = LOGO_URI[k] || '';
      // title / alt 交给 updateChain 按「揭开没有」来写，免得盖着还被剧透
      li.appendChild(img);
      chainListEl.appendChild(li);
      chainItems.push(li);
      chainImgs.push(img);
    }
  })();

  function updateChain() {
    var top = 0;
    for (var i = 0; i < CELLS; i++) {
      if (!cells[i]) continue;
      var r = rankOf(cells[i].value);
      if (r > top) top = r;
    }
    if (top > LOGO_MAX) top = LOGO_MAX;
    for (var k = 0; k < chainItems.length; k++) {
      if (k < top) chainItems[k].classList.add('got');
      else chainItems[k].classList.remove('got');

      // 压轴的「上高二中」要等合出上交大之后才揭开。
      // 盖住时连 title / alt 一起清掉，不然鼠标一悬停就把谜底说出来了
      var sealed = (k === LOGO_MAX - 1) && !reached2048;
      var name = sealed ? '' : (LOGO_NAME[k + 1] || '');
      chainItems[k].title = name;
      chainImgs[k].alt = name;
      if (sealed) chainItems[k].classList.add('locked');
      else chainItems[k].classList.remove('locked');
    }

    chainNowEl.textContent = top > 0 ? LOGO_NAME[top] : '';
  }

  /* ---------------- 方块 ---------------- */
  function paint(tile) {
    var el = tile.el;
    var rank = rankOf(tile.value);
    var src = LOGO_URI[rank];
    var d = String(tile.value).length;
    el.dataset.d = String(d > 4 ? 4 : d);

    // 合过 4096 之后没有对应校徽了，退回显示数字
    if (tile.img && !src) {
      el.removeChild(tile.img);
      tile.img = null;
    }

    if (src) {
      el.dataset.val = String(tile.value);
      if (!tile.img) {
        var img = document.createElement('img');
        img.className = 'logo';
        img.alt = '';
        img.draggable = false;
        tile.img = img;
        el.appendChild(img);
      }
      tile.img.src = src;
      el.title = LOGO_NAME[rank] || '';
    } else {
      el.dataset.val = 'digit';
      el.textContent = tile.value;
      el.title = '';
    }
  }

  function createTile(value, r, c) {
    var el = document.createElement('div');
    el.className = 'tile appear';
    el.style.setProperty('--r', r);
    el.style.setProperty('--c', c);

    var tile = { id: nextId++, value: value, r: r, c: c, el: el, img: null };
    paint(tile);
    layerEl.appendChild(el);
    tiles[tile.id] = tile;
    return tile;
  }

  function place(tile) {
    tile.el.style.setProperty('--r', tile.r);
    tile.el.style.setProperty('--c', tile.c);
  }

  function removeTile(tile) {
    if (tile.el.parentNode) tile.el.parentNode.removeChild(tile.el);
    delete tiles[tile.id];
  }

  function retarget(tile, idx) {
    tile.r = Math.floor(idx / SIZE);
    tile.c = idx % SIZE;
  }

  /* ---------------- 得分 ---------------- */
  function bumpScoreNode(node) {
    node.classList.remove('bump');
    void node.offsetWidth;
    node.classList.add('bump');
  }

  function updateScore(gained) {
    scoreEl.textContent = score;
    if (gained) bumpScoreNode(scoreEl);
    if (score > best) {
      best = score;
      saveBest(best);
      bestEl.textContent = best;
      bumpScoreNode(bestEl);
    }
  }

  /* ---------------- 新游戏 ---------------- */
  function newGame() {
    var ks = Object.keys(tiles);
    for (var i = 0; i < ks.length; i++) removeTile(tiles[ks[i]]);

    cells = new Array(CELLS).fill(null);
    score = 0;
    busy = false;
    pendingDir = null;
    gameOver = false;
    reached2048 = false;
    reached4096 = false;
    showed4096 = false;
    keepPlaying = false;
    hideOverlay();

    addRandomTile();
    addRandomTile();
    scoreEl.textContent = '0';
    updateChain();
  }

  function addRandomTile() {
    var empty = [];
    for (var i = 0; i < CELLS; i++) if (!cells[i]) empty.push(i);
    if (!empty.length) return null;

    var idx = empty[Math.floor(Math.random() * empty.length)];
    var value = Math.random() < 0.9 ? 2 : 4;
    var tile = createTile(value, Math.floor(idx / SIZE), idx % SIZE);
    cells[idx] = tile;
    return tile;
  }

  /* ---------------- 移动 ---------------- */
  // 生成 4 条「线」，每条按前进方向从近到远排列
  function linesFor(dir) {
    var lines = [];
    for (var i = 0; i < SIZE; i++) {
      var line = [];
      for (var j = 0; j < SIZE; j++) {
        var r, c;
        if (dir === 'left')       { r = i; c = j; }
        else if (dir === 'right') { r = i; c = SIZE - 1 - j; }
        else if (dir === 'up')    { r = j; c = i; }
        else                      { r = SIZE - 1 - j; c = i; }
        line.push(r * SIZE + c);
      }
      lines.push(line);
    }
    return lines;
  }

  function move(dir) {
    var lines = linesFor(dir);
    var moving = [];
    var merges = [];
    var moved = false;
    var gained = 0;

    for (var li = 0; li < lines.length; li++) {
      var line = lines[li];
      var seq = [];
      for (var k = 0; k < line.length; k++) {
        if (cells[line[k]]) seq.push(cells[line[k]]);
      }

      var write = 0;
      var i = 0;
      while (i < seq.length) {
        var tile = seq[i];
        var next = seq[i + 1];
        var targetIdx = line[write];

        if (next && next.value === tile.value) {
          // 合并：两块都滑向同一格
          cells[tile.r * SIZE + tile.c] = null;
          cells[next.r * SIZE + next.c] = null;   // 清除被吞并方块的旧格
          retarget(tile, targetIdx);
          cells[targetIdx] = tile;

          next.r = tile.r;
          next.c = tile.c;

          moving.push(tile);
          moving.push(next);
          merges.push({ survivor: tile, absorbed: next, value: tile.value * 2 });
          gained += tile.value * 2;
          moved = true;
          i += 2;
        } else {
          if (tile.r * SIZE + tile.c !== targetIdx) moved = true;
          cells[tile.r * SIZE + tile.c] = null;
          retarget(tile, targetIdx);
          cells[targetIdx] = tile;
          moving.push(tile);
          i += 1;
        }
        write++;
      }
    }

    if (!moved) return;

    for (var m = 0; m < moving.length; m++) place(moving[m]);

    busy = true;

    window.setTimeout(function () {
      for (var n = 0; n < merges.length; n++) {
        var mg = merges[n];
        removeTile(mg.absorbed);
        mg.survivor.value = mg.value;
        paint(mg.survivor);
        mg.survivor.el.classList.remove('pop');
        void mg.survivor.el.offsetWidth;
        mg.survivor.el.classList.add('pop');
        if (mg.value === 2048) reached2048 = true;
        if (mg.value === 4096) reached4096 = true;
      }

      if (gained) {
        score += gained;
        updateScore(gained);
      }

      addRandomTile();
      updateChain();
      busy = false;

      if (reached4096 && !showed4096) {
        showed4096 = true;
        showOverlay('final');
      } else if (reached2048 && !keepPlaying) {
        showOverlay('win');
      } else if (isGameOver()) {
        gameOver = true;
        showOverlay('lose');
      }

      if (pendingDir !== null) {
        var d = pendingDir;
        pendingDir = null;
        if (!gameOver && !(reached2048 && !keepPlaying)) move(d);
      }
    }, MOVE_MS);
  }

  function isGameOver() {
    for (var i = 0; i < CELLS; i++) {
      var t = cells[i];
      if (!t) return false;
      var c = i % SIZE;
      var r = Math.floor(i / SIZE);
      if (c < SIZE - 1 && cells[i + 1] && cells[i + 1].value === t.value) return false;
      if (r < SIZE - 1 && cells[i + SIZE] && cells[i + SIZE].value === t.value) return false;
    }
    return true;
  }

  /* ---------------- 遮罩 ---------------- */
  function showOverlay(kind) {
    if (kind === 'win') {
      ovTitleEl.textContent = '合成上交大！';
      ovDescEl.textContent = '上交大到手了，再往上还有上高二中。';
      ovBtnEl.textContent = '继续挑战';
    } else if (kind === 'final') {
      ovTitleEl.textContent = '上高二中！';
      ovDescEl.textContent = '十二枚校徽全部集齐，圆满。';
      ovBtnEl.textContent = '继续挑战';
    } else {
      ovTitleEl.textContent = '无路可走了';
      ovDescEl.textContent = '本局得分 ' + score + '，再来一次？';
      ovBtnEl.textContent = '再来一局';
    }
    ovBtnEl.dataset.kind = kind;
    overlayEl.hidden = false;
  }
  function hideOverlay() { overlayEl.hidden = true; }

  function overlayAction() {
    var kind = ovBtnEl.dataset.kind;
    if (kind === 'win' || kind === 'final') {
      keepPlaying = true;
      hideOverlay();
      if (pendingDir !== null) {
        var d = pendingDir; pendingDir = null; move(d);
      }
    } else {
      newGame();
    }
  }

  /* ================= AI 演示 =================
     策略：expectimax 搜索 + 启发式评估。
     棋盘用「2 的指数」表示（0 表示空格），比如 2 -> 1、2048 -> 11。
     ============================================ */

  var AI_DIRS = ['left', 'right', 'up', 'down'];   // 与 moveGrid 的方向编号一致

  // moveGrid 的草稿数组：预分配，避免每次调用都新建数组（搜索时调用极频繁）
  var MG_LINE = [0, 0, 0, 0];
  var MG_RES = [0, 0, 0, 0];

  // 在纯数组上模拟一步移动，返回新棋盘；无法移动时返回 null
  function moveGrid(g, dir) {
    var out = new Uint8Array(16);
    var i, j, n, m, r, c;

    for (i = 0; i < 4; i++) {
      for (j = 0; j < 4; j++) {
        if (dir === 0)      { r = i;     c = j; }
        else if (dir === 1) { r = i;     c = 3 - j; }
        else if (dir === 2) { r = j;     c = i; }
        else                { r = 3 - j; c = i; }
        MG_LINE[j] = g[r * 4 + c];
      }

      // 压掉空格（原地压缩，复用同一个数组）
      n = 0;
      for (j = 0; j < 4; j++) if (MG_LINE[j]) MG_LINE[n++] = MG_LINE[j];

      // 相邻同值合并
      m = 0;
      for (j = 0; j < n; j++) {
        if (j + 1 < n && MG_LINE[j] === MG_LINE[j + 1]) {
          MG_RES[m++] = MG_LINE[j] + 1;
          j++;
        } else {
          MG_RES[m++] = MG_LINE[j];
        }
      }
      while (m < 4) MG_RES[m++] = 0;

      for (j = 0; j < 4; j++) {
        if (dir === 0)      { r = i;     c = j; }
        else if (dir === 1) { r = i;     c = 3 - j; }
        else if (dir === 2) { r = j;     c = i; }
        else                { r = 3 - j; c = i; }
        out[r * 4 + c] = MG_RES[j];
      }
    }

    for (var x = 0; x < 16; x++) if (out[x] !== g[x]) return out;
    return null;
  }

  // 查表把指数还原成真实数值：TILE_VAL[r] = 2^r
  // 关键：所有启发项都用「真实数值」而不是 log2 指数，
  // 这样 1024 和 512 相差 16 倍，大块的位置才会真正压倒一切。
  var TILE_VAL = [];
  for (var tv = 0; tv < 32; tv++) TILE_VAL.push(Math.pow(2, tv));

  function countEmpty(g) {
    var n = 0;
    for (var i = 0; i < 16; i++) if (!g[i]) n++;
    return n;
  }

  // 四个角落出发的蛇形路径（大数应该沿这条路径从角落开始依次变小）
  var SNAKE_PATHS = [
    [0, 1, 2, 3, 7, 6, 5, 4, 8, 9, 10, 11, 15, 14, 13, 12],   // 左上角起步
    [3, 2, 1, 0, 4, 5, 6, 7, 11, 10, 9, 8, 12, 13, 14, 15],   // 右上角起步
    [12, 13, 14, 15, 11, 10, 9, 8, 4, 5, 6, 7, 3, 2, 1, 0],   // 左下角起步
    [15, 14, 13, 12, 8, 9, 10, 11, 7, 6, 5, 4, 0, 1, 2, 3]    // 右下角起步
  ];
  var SNAKE_W = [];
  for (var sw = 0; sw < 16; sw++) SNAKE_W.push(Math.pow(0.5, sw));   // 越靠路径开头权重越大

  // 蛇形评分：取四个角落里最好的一个。完美蛇形棋盘约等于 maxV
  function snakeScore(g) {
    var best = -Infinity;
    for (var p = 0; p < 4; p++) {
      var path = SNAKE_PATHS[p], s = 0;
      for (var k = 0; k < 16; k++) {
        var v = g[path[k]];
        if (v) s += TILE_VAL[v] * SNAKE_W[k];
      }
      if (s > best) best = s;
    }
    return best;
  }

  // 平滑度：相邻格数值越接近越好（用真实数值）
  function smoothnessScore(g) {
    var s = 0;
    for (var r = 0; r < 4; r++) {
      for (var c = 0; c < 4; c++) {
        var v = g[r * 4 + c];
        if (!v) continue;
        var av = TILE_VAL[v];
        if (c < 3 && g[r * 4 + c + 1]) s -= Math.abs(av - TILE_VAL[g[r * 4 + c + 1]]);
        if (r < 3 && g[(r + 1) * 4 + c]) s -= Math.abs(av - TILE_VAL[g[(r + 1) * 4 + c]]);
      }
    }
    return s;
  }

  // 一条线的锯齿程度：总落差 - 最大跨度。完全单调时为 0，越来回横跳越负。
  // 与方向无关（递增递减都算单调），再除以该线自己的最大块做归一化。
  function lineMono(vals) {
    if (vals.length < 2) return 0;
    var tv = 0, mn = vals[0], mx = vals[0];
    for (var i = 0; i + 1 < vals.length; i++) {
      tv += Math.abs(vals[i + 1] - vals[i]);
      if (vals[i + 1] < mn) mn = vals[i + 1];
      if (vals[i + 1] > mx) mx = vals[i + 1];
    }
    return -(tv - (mx - mn)) / mx;
  }

  // 全盘单调性惩罚，范围约 [-16, 0]，0 表示每一行每一列都是单调的
  function monotonicityScore(g) {
    var total = 0, k, v;
    for (var r = 0; r < 4; r++) {
      var rowVals = [];
      for (var c = 0; c < 4; c++) { v = g[r * 4 + c]; if (v) rowVals.push(TILE_VAL[v]); }
      total += lineMono(rowVals);
    }
    for (var c2 = 0; c2 < 4; c2++) {
      var colVals = [];
      for (var r2 = 0; r2 < 4; r2++) { v = g[r2 * 4 + c2]; if (v) colVals.push(TILE_VAL[v]); }
      total += lineMono(colVals);
    }
    return total;
  }

  // 启发式权重。这组数是拿 16 个配置各跑 16 局做网格搜索挑出来的，
  // 通关率 16/16；调参时发现蛇形权重过高（2500+）反而变差（棋盘太僵硬）。
  var AI_W = {
    empty:   50,    // 每个空格
    snake: 1800,    // 蛇形贴合度（已除以最大块，0~2）
    mono:   250,    // 单调性惩罚（已按行归一化，-16~0）
    smooth: 150,    // 平滑度（已除以最大块，负值）
    max:     20     // 轻微鼓励合成更大块
  };

  function evaluateGrid(g) {
    var i, empty = 0, maxRank = 0;
    for (i = 0; i < 16; i++) { if (!g[i]) empty++; else if (g[i] > maxRank) maxRank = g[i]; }
    if (!maxRank) return 0;

    var maxV = TILE_VAL[maxRank];

    return AI_W.empty * empty
         + AI_W.snake * (snakeScore(g) / maxV)
         + AI_W.mono * monotonicityScore(g)
         + AI_W.smooth * (smoothnessScore(g) / maxV)
         + AI_W.max * maxRank;
  }

  // 随机节点用的空位下标缓冲。按搜索深度分层，避免递归时上下层互相覆盖。
  var EMPTY_BUF = [];
  function emptyBuf(depth) {
    var b = EMPTY_BUF[depth];
    if (!b) b = EMPTY_BUF[depth] = new Int32Array(16);
    return b;
  }

  function expectimax(g, depth, isPlayer) {
    if (depth <= 0) return evaluateGrid(g);

    if (isPlayer) {
      var best = -Infinity;
      for (var d = 0; d < 4; d++) {
        var next = moveGrid(g, d);
        if (!next) continue;
        var v = expectimax(next, depth - 1, false);
        if (v > best) best = v;
      }
      return best === -Infinity ? evaluateGrid(g) - 1e6 : best;
    }

    // 随机节点：在空位生成 2（90%）或 4（10%）
    var empties = emptyBuf(depth);
    var n = 0, i;
    for (i = 0; i < 16; i++) if (!g[i]) empties[n++] = i;

    if (n === 0) return expectimax(g, depth - 1, true);

    var p2 = 0.9 / n;
    var p4 = 0.1 / n;
    var sum = 0;
    for (var e = 0; e < n; e++) {
      var idx = empties[e];
      g[idx] = 1;                                   // 就地放一个 2
      sum += p2 * expectimax(g, depth - 1, true);
      g[idx] = 2;                                   // 就地换成一个 4
      sum += p4 * expectimax(g, depth - 1, true);
      g[idx] = 0;                                   // 还原
    }
    return sum;
  }

  function gridFromCells() {
    var g = new Uint8Array(16);
    for (var i = 0; i < 16; i++) {
      var t = cells[i];
      if (t) g[i] = rankOf(t.value);
    }
    return g;
  }

  // 搜索层数（空格多时分支多、算得慢，就搜浅一点）
  var AI_DEPTH_OPEN = 4;
  var AI_DEPTH_TIGHT = 6;

  // 返回最佳方向名，无处可走时返回 null
  function aiChooseMove() {
    var g = gridFromCells();
    var depth = countEmpty(g) >= 6 ? AI_DEPTH_OPEN : AI_DEPTH_TIGHT;

    var best = -Infinity, bestDir = -1;
    for (var d = 0; d < 4; d++) {
      var next = moveGrid(g, d);
      if (!next) continue;
      var v = expectimax(next, depth - 1, false);
      if (v > best) { best = v; bestDir = d; }
    }
    return bestDir < 0 ? null : AI_DIRS[bestDir];
  }

  /* ---------------- 演示循环 ---------------- */
  var aiRunning = false;
  var aiTimer = null;
  var aiPace = 450;
  var aiSteps = 0;

  function aiTick() {
    aiTimer = null;
    if (!aiRunning) return;
    if (gameOver || (reached2048 && !keepPlaying)) { stopDemo(); return; }
    if (busy) { aiTimer = window.setTimeout(aiTick, 60); return; }

    var t0 = Date.now();
    var dir = aiChooseMove();
    var spent = Date.now() - t0;
    if (!dir) { stopDemo(); return; }

    aiSteps++;
    aiStatusEl.textContent = 'AI 正在演示 · 第 ' + aiSteps + ' 步';
    move(dir);
    // 扣掉思考耗时，让每步的观感节奏稳定在 aiPace 附近，不会忽快忽慢
    aiTimer = window.setTimeout(aiTick, Math.max(80, aiPace - spent));
  }

  function startDemo() {
    stopDemo();
    newGame();
    aiSteps = 0;
    aiRunning = true;
    aiBtnEl.textContent = '停止演示';
    aiBarEl.hidden = false;
    aiStatusEl.textContent = 'AI 正在演示 · 准备中';
    aiTimer = window.setTimeout(aiTick, 700);   // 先停一下，让人看清起始棋盘
  }

  function stopDemo() {
    aiRunning = false;
    if (aiTimer) { window.clearTimeout(aiTimer); aiTimer = null; }
    pendingDir = null;
    aiBtnEl.textContent = 'AI 操作示范';
    aiBarEl.hidden = true;
  }

  /* ---------------- 输入 ---------------- */
  function requestMove(dir) {
    if (aiRunning) stopDemo();        // 玩家一操作就接管
    if (gameOver) return;
    if (reached2048 && !keepPlaying) return;
    if (busy) { pendingDir = dir; return; }
    move(dir);
  }

  var KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var dir = KEYS[e.key];
    if (!dir) return;
    e.preventDefault();
    requestMove(dir);
  }, { passive: false });

  // 触摸滑动
  var startX = 0, startY = 0, tracking = false;

  boardEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  boardEl.addEventListener('touchmove', function (e) {
    if (tracking) e.preventDefault();
  }, { passive: false });

  boardEl.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;
    requestMove(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });

  // 鼠标拖动（桌面端也能滑）
  var mouseDown = false;
  boardEl.addEventListener('mousedown', function (e) {
    mouseDown = true;
    startX = e.clientX;
    startY = e.clientY;
  });
  window.addEventListener('mouseup', function (e) {
    if (!mouseDown) return;
    mouseDown = false;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 32) return;
    requestMove(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  newBtnEl.addEventListener('click', function () {
    stopDemo();
    newGame();
  });
  ovBtnEl.addEventListener('click', overlayAction);

  aiBtnEl.addEventListener('click', function () {
    if (aiRunning) stopDemo(); else startDemo();
  });

  var speedBtns = aiBarEl.querySelectorAll('.speeds button');
  for (var si = 0; si < speedBtns.length; si++) {
    speedBtns[si].addEventListener('click', function () {
      aiPace = parseInt(this.dataset.ms, 10) || 450;
      for (var k = 0; k < speedBtns.length; k++) speedBtns[k].classList.remove('on');
      this.classList.add('on');
    });
  }

  /* ---------------- 启动 ---------------- */
  best = loadBest();
  bestEl.textContent = best;
  newGame();
})();
</script>
</body>
</html>
